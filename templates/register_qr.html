<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>QR-код для 2FA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 text-center">
        <h2 class="mb-4">Привет, {{ username }}!</h2>
        <p>Сканируй этот QR-код в приложении Google Authenticator:</p>

        {% if qr_code %}
            <img src="data:image/png;base64,{{ qr_code }}" alt="QR-код" class="img-thumbnail mb-4" width="250" height="250">
        {% else %}
            <p class="text-danger">QR-код не найден.</p>
        {% endif %}

        <div class="mt-4">
            <a href="{{ url_for('login') }}" class="btn btn-primary">Перейти к входу</a>
        </div>
    </div>
</body>
</html>
