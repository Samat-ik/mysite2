{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <h2>📦 Почтовые услуги — Кол-во карточек Print2Card</h2>
  <canvas id="postChart" height="100"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const ctx = document.getElementById('postChart').getContext('2d');
const chart = new Chart(ctx, {
    type: 'bar',
    data: {
        labels: {{ labels|tojson }},
        datasets: [{
            label: 'Принято карточек',
            data: {{ values|tojson }},
            backgroundColor: 'rgba(0, 123, 255, 0.7)',
            borderColor: 'rgba(0, 123, 255, 1)',
            borderWidth: 1
        }]
    },
    options: {
        scales: {
            y: { beginAtZero: true }
        },
        responsive: true,
        plugins: {
            legend: { position: 'top' },
            title: {
                display: true,
                text: 'Количество принятых почтовых карточек по отделениям'
            }
        }
    }
});
</script>
{% endblock %}
