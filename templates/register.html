<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-4 text-center">Регистрация</h3>
            <form method="POST">
              <div class="mb-3">
                <label for="username" class="form-label">Имя пользователя</label>
                <input type="text" class="form-control" id="username" name="username" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email адрес</label>
                <input type="email" class="form-control" id="email" name="email" required>
                <div class="form-text">Email немесе телефон нөмірі міндетті</div>
              </div>
              <div class="mb-3">
                <label for="phone_number" class="form-label">Телефон нөмірі</label>
                <input type="tel" class="form-control" id="phone_number" name="phone_number" placeholder="+7 (777) 123-45-67">
                <div class="form-text">Email немесе телефон нөмірі міндетті</div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" name="password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
            </form>
            <div class="mt-3 text-center">
              <a href="{{ url_for('login') }}">Уже есть аккаунт? Войти</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
